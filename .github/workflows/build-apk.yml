name: Build debug APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Accept Android SDK licenses (SDK is preinstalled on the runner)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew assembleDebug assembleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: GlassMusic-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk
      - name: Publish APK as a GitHub release
        id: release
        # Creating a release is sometimes refused (HTTP 403 on the releases endpoint): retry instead of failing the run
        # (the emulator job below must still get to run).
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk GlassMusic-debug.apk
          cp app/build/outputs/apk/release/app-release.apk GlassMusic.apk
          tag="build-${{ github.run_number }}"
          for attempt in 1 2 3 4 5 6; do
            if gh release view "$tag" > /dev/null 2>&1; then
              gh release upload "$tag" GlassMusic.apk GlassMusic-debug.apk --clobber && exit 0
            else
              gh release create "$tag" GlassMusic.apk GlassMusic-debug.apk \
                --target "${{ github.sha }}" --prerelease \
                --title "Glass Music build ${{ github.run_number }}" \
                --notes "GlassMusic.apk = optimised (smooth) build, GlassMusic-debug.apk = debug build. Built from ${{ github.sha }}." && exit 0
            fi
            echo "release attempt $attempt failed; retrying in $((attempt * 20)) s"
            sleep $((attempt * 20))
          done
          echo "::warning::could not publish the release for $tag"
          exit 1
      - name: Fallback - put the APK on a branch when the release could not be created
        if: steps.release.outcome == 'failure'
        run: |
          mkdir -p apkpub && cp GlassMusic.apk GlassMusic-debug.apk apkpub/
          echo "build ${{ github.run_number }} from ${{ github.sha }}" > apkpub/BUILD.txt
          cd apkpub && git init -q && git checkout -q -b apk-latest && git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "APK for build ${{ github.run_number }} (${{ github.sha }})"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" apk-latest
          echo "APK: https://github.com/${{ github.repository }}/raw/apk-latest/GlassMusic.apk"

  emulator-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: GlassMusic-debug-apk
          path: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install ffmpeg (builds the FLAC / M4A test songs that carry lyrics)
        continue-on-error: true
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Install, launch and screenshot on an Android 14 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: bash ci/emulator-flow.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-output
          path: out
      - name: Publish screenshots to branch ci-screenshots
        if: always()
        run: |
          mkdir -p shots && cp out/* shots/ 2>/dev/null || true
          cd shots && git init -q && git checkout -q -b ci-screenshots && git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "screenshots for $GITHUB_SHA" || exit 0
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-screenshots
