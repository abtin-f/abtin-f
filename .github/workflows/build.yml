name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/iPhoneKeyboard.apk

      - uses: actions/upload-artifact@v4
        with:
          name: iPhoneKeyboard-apk
          path: out/iPhoneKeyboard.apk

      - name: Publish release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: کیبورد آیفون v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: out/iPhoneKeyboard.apk
